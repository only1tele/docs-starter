    PaginationMeta:
      type: object
      required:
      - total
      - limit
      - has_more
      - next_cursor
      properties:
        total:
          type: integer
          minimum: 0
          description: Total number of records matching the request.
          example: 84
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of records requested for this response.
          example: 20
        has_more:
          type: boolean
          description: Whether more records are available after this response.
          example: true
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor to pass in the next request. `null` when there are no more records.
          example: cur_01HXYZ9999XXXXXX
      example:
        total: 84
        limit: 20
        has_more: true
        next_cursor: cur_01HXYZ9999XXXXXX
