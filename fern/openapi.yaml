  #       description: Retrieve invoices generated for a subscription. Results are returned using cursor-based pagination.
  /v1/proxy-requests/{id}:
    get:
      operationId: getProxyRequest
      summary: Confirm a paid request
      description: Retrieve a paid request by the Mitu request ID received by your API.
      tags:
      - Agent payments
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Paid request retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Account API key used to authenticate server-side requests. Use the credentials issued for the
        same environment as the API base URL.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the resource.
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key used to safely retry the same state-changing request.
      schema:
        type: string
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned as `next_cursor` from the previous response. Omit for the first request.
      schema:
        type: string
  schemas:
    PaymentLinkType:
      type: string
      enum:
      - charge
      - subscription
      - session
      - per_request
    PaymentLinkStatus:
      type: string
      enum:
      - pending
      - partial
      - active
      - settling
      - paid
      - settled
      - expired
      - cancelled
    PaymentMethod:
      type: string
      enum:
      - x402
      - mpp_crypto
      - mpp_spt
    InvoiceStatus:
      type: string
      enum:
      - draft
      - sent
      - viewed
      - settling
      - paid
      - overdue
      - cancelled
    BillingInterval:
      type: string
      enum:
      - day
      - week
      - month
      - year
    SubscriptionStatus:
      type: string
      enum:
      - active
      - past_due
      - paused
      - cancelled
      - expired
    CreateCustomer:
      type: object
      required:
      - client_reference_id
      properties:
        client_reference_id:
          type: string
          maxLength: 64
          example: goro_user_8841
          description: Your own stable identifier for this customer.
        first_name:
          type: string
          maxLength: 60
          example: Tele
        last_name:
          type: string
          maxLength: 60
          example: Falola
        email:
          type: string
          format: email
          maxLength: 180
          example: tele@mitu.ai
        phone:
          type: string
          maxLength: 32
          example: '+2348012345678'
      example:
        client_reference_id: goro_user_8841
        first_name: Tele
        last_name: Falola
        email: tele@mitu.ai
        phone: '+2348012345678'
    IssuedCustomer:
      type: object
      properties:
        id:
          type: string
          example: cus_0t9549fps3xd
        client_reference_id:
          type: string
          example: goro_user_8841
          description: Your own stable identifier for this customer.
        first_name:
          type: string
          example: Tele
          nullable: true
        last_name:
          type: string
          example: Falola
          nullable: true
        email:
          type: string
          example: 'tele@mitu.ai'
          nullable: true
        phone:
          type: string
          example: '+2348012345678'
          nullable: true
        key:
          type: string
          description: Customer key returned when the customer is created.
          example: mcpk_7f3a9c2e5b14d806a1f2
        mcp_url:
          type: string
          example: 'https://mcp.mitu.ai/goro'
        created_at:
          type: string
          example: '2026-09-11T15:00:34.915Z'
          format: date-time
      example:
        id: cus_0t9549fps3xd
        client_reference_id: goro_user_8841
        first_name: Tele
        last_name: Falola
        email: tele@mitu.ai
        phone: '+2348012345678'
        key: mcpk_live_7f3a9c2e5b14d806a1f2
        mcp_url: https://mcp.mitu.ai/goro
        created_at: '2026-09-09T18:41:50.204Z'
    RotatedCustomerKey:
      type: object
      properties:
        id:
          type: string
          example: cus_0t9549fps3xd
        client_reference_id:
          type: string
          example: goro_user_8841
          nullable: true
          description: Your own stable identifier for this customer.
        key:
          type: string
          description: The new customer key. Returned once and not retrievable afterwards.
          example: mcpk_9d41b7c2f80e5a63b4d1a7e8
        mcp_url:
          type: string
          example: 'https://mcp.mitu.ai/goro'
          nullable: true
        rotated:
          type: string
          example: '2026-09-14T10:22:07.118Z'
          format: date-time
          description: When the new key was issued.
      example:
        id: cus_0t9549fps3xd
        client_reference_id: goro_user_8841
        key: mcpk_9d41b7c2f80e5a63b4d1a7e8
        mcp_url: https://mcp.mitu.ai/goro
        rotated: '2026-09-14T10:22:07.118Z'
    RotatedCustomerKeyResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
          example: Customer key rotated successfully
        data:
          $ref: '#/components/schemas/RotatedCustomerKey'
    WalletLimits:
      type: object
      description: What an agent may spend from this wallet, in USD. Zero is an explicit "no limit"; an omitted
        field keeps whatever the wallet inherited.
      properties:
        per_payment:
          type: number
          minimum: 0
          example: 25
        monthly:
          type: number
          minimum: 0
          example: 200
        approve_above:
          type: number
          minimum: 0
          example: 50
    CreateWallet:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 80
          example: Travel
          description: What the customer calls this pot. The agent names it when paying, so it should read the way
            the customer would say it.
        limits:
          $ref: '#/components/schemas/WalletLimits'
      example:
        name: Travel
        limits:
          per_payment: 25
          monthly: 200
          approve_above: 50
    WalletSummary:
      type: object
      properties:
        id:
          type: string
          example: wal_65286515b43d4e3eba93
        customer_id:
          type: string
          example: cus_0t9549fps3xd
        name:
          type: string
          example: Travel
        currency:
          type: string
          example: USDC
        balance:
          $ref: '#/components/schemas/WalletBalance'
        limits:
          allOf:
          - $ref: '#/components/schemas/WalletLimits'
          - type: object
            properties:
              currency:
                type: string
                example: USD
        created_at:
          type: string
          example: '2026-09-11T00:32:58.292Z'
          format: date-time
    WalletBalance:
      type: object
      description: What the wallet holds, in the wallet's own currency. Amounts are strings so a balance is never
        rounded by a JSON number.
      required:
      - total
      - by_chain
      properties:
        total:
          type: string
          description: The wallet's total balance across every network.
          example: '0.067000'
        by_chain:
          type: object
          description: The same balance broken down by network.
          additionalProperties:
            type: string
          example:
            base: '0.067000'
            tempo: '0'
            solana: '0'
    Wallet:
      allOf:
      - $ref: '#/components/schemas/WalletSummary'
      - type: object
        properties:
          addresses:
            type: array
            items:
              type: object
              properties:
                network:
                  type: string
                  example: base
                address:
                  type: string
      example:
        id: wal_65286515b43d4e3eba93
        customer_id: cus_0t9549fps3xd
        name: Travel
        currency: USDC
        balance:
          total: '0.067000'
          by_chain:
            base: '0.067000'
            tempo: '0'
            solana: '0'
        limits:
          per_payment: 25
          monthly: 200
          approve_above: 50
          currency: USD
        addresses:
        - network: base
          address: '0xa90818aeC6b04b6E48c9bD7A5C0d8B3F17e2419d'
        - network: tempo
          address: '0xa90818aeC6b04b6E48c9bD7A5C0d8B3F17e2419d'
        - network: solana
          address: 7U6P9CrM7CqkYyNbBLpKfoJcWn4sVz1TgDxMhRa2EuQK
        created_at: '2026-09-11T00:32:58.292Z'
    WalletTransactionReason:
      type: string
      enum:
      - deposit
      - payment
      - withdrawal
      - reversal
    WalletTransactionDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - merchant
          - external
        name:
          type: string
          example: AgentPizza
          nullable: true
        address:
          type: string
          example: '0x1DDb114B971E67241B3aF19C958a01EBBfb1B6DD'
          nullable: true
    WalletTransaction:
      type: object
      description: One movement of money into or out of an Agent Wallet. `balance_after` is the balance of this
        wallet alone, not the customer's combined balance across wallets.
      properties:
        id:
          type: string
          example: wtx_5e8c31b9a047
        wallet_id:
          type: string
          example: wal_65286515b43d4e3eba93
        customer_id:
          type: string
          example: cus_0t9549fps3xd
        type:
          type: string
          enum:
          - credit
          - debit
        reason:
          $ref: '#/components/schemas/WalletTransactionReason'
        amount:
          type: string
          example: '0.035000'
          description: Decimal amount, sent as a string.
        currency:
          type: string
          example: USDC
        network:
          type: string
          nullable: true
          example: base
        destination:
          oneOf:
          - $ref: '#/components/schemas/WalletTransactionDestination'
          - type: 'null'
          description: Where a debit went. `null` for credits.
        tx_hash:
          type: string
          example: '0xfe093b9a57695615cc453f86b2890eb70e0a2860ce040f54af7aca03ce2a89ab'
          nullable: true
          description: The onchain settlement you can verify yourself.
        balance_after:
          type: string
          example: '0.032000'
          description: The wallet's balance once this movement was applied.
        created_at:
          type: string
          example: '2026-09-09T19:03:28.480Z'
          format: date-time
      example:
        id: f5533e85-16d8-4f58-ba22-86dba59c6a15
        wallet_id: wal_65286515b43d4e3eba93
        customer_id: cus_0t9549fps3xd
        type: debit
        reason: payment
        amount: '0.035000'
        currency: USDC
        network: base
        destination:
          type: merchant
          name: AgentPizza
          address: '0x1DDb114B971E67241B3aF19C958a01EBBfb1B6DD'
        tx_hash: '0xfe093b9a57695615cc453f86b2890eb70e0a2860ce040f54af7aca03ce2a89ab'
        balance_after: '0.032000'
        created_at: '2026-09-09T19:03:28.480Z'
    CreatePaymentLink:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/PaymentLinkType'
          default: charge
        amount:
          type: number
          example: 25
          description: Required for `charge` and `per_request`. `session` uses `sessionMaxDeposit`; `subscription`
            derives it from the plan.
        currency:
          type: string
          example: USD
          description: Required except for `subscription`, which takes it from the plan.
        description:
          type: string
          example: Two large pizzas
          maxLength: 2000
        reference:
          type: string
          example: ORDER-8841
          maxLength: 255
          description: Your own reference for this payment, such as an order or booking id. Returned with payment
            events so you can reconcile against a record your system already knows.
        expiresAt:
          type: string
          example: '2026-09-30T23:59:59.000Z'
          format: date-time
          description: When the payment can no longer be completed.
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          description: The agent payment methods available for this payment.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Free-form metadata returned with the payment. Do not store secrets or sensitive credentials
            here.
        planId:
          type: string
          example: plan_6d1a83f95c20
          description: '`subscription` only — a single plan id.'
        planIds:
          type: array
          items:
            type: string
          description: '`subscription` only — offer several plans for the payer to choose between.'
        allowCustomerChoice:
          type: boolean
          example: false
          default: false
          description: '`subscription` only — let the payer choose among `planIds`.'
        sessionMaxDeposit:
          type: number
          example: 50
          description: '`session` only — the most the payer can fund for the session.'
        sessionExpiresAt:
          type: string
          example: '2026-09-30T23:59:59.000Z'
          format: date-time
          description: '`session` only.'
        endpointPattern:
          type: string
          example: /orders
          maxLength: 500
          description: '`per_request` only — the API path the payment applies to.'
      example:
        type: charge
        amount: 25
        currency: USD
        description: Two large pizzas
        reference: ORDER-8841
        expiresAt: '2026-09-30T23:59:59.000Z'
        paymentMethods:
        - x402
        - mpp_crypto
        metadata:
          order_id: '8841'
    UpdatePaymentLink:
      type: object
      properties:
        description:
          type: string
          example: Two large pizzas
          maxLength: 2000
        reference:
          type: string
          example: ORDER-8841
          maxLength: 255
        expiresAt:
          type: string
          example: '2026-09-30T23:59:59.000Z'
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
      example:
        description: Two large pizzas and a side
        reference: ORDER-8841
        expiresAt: '2026-09-30T23:59:59.000Z'
    InvoiceLineItem:
      type: object
      required:
      - name
      - quantity
      - amount
      properties:
        name:
          type: string
          example: Large pizza
          maxLength: 255
        description:
          type: string
          example: 'Pepperoni, thin crust'
          maxLength: 500
        quantity:
          type: integer
          example: 2
          minimum: 1
        amount:
          type: number
          example: 12.5
      example:
        name: Integration support
        description: 10 hours
        quantity: 10
        amount: 150
    CreateInvoice:
      type: object
      required:
      - customer_id
      - line_items
      - currency
      properties:
        customer_id:
          type: string
          example: cus_0t9549fps3xd
          description: Who the invoice is addressed to.
        invoice_number:
          type: string
          example: INV-1042
          maxLength: 50
        description:
          type: string
          example: September delivery
          maxLength: 2000
        line_items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        currency:
          type: string
          example: USD
        tax_amount:
          type: number
          example: 12
          minimum: 0
          default: 0
        discount_amount:
          type: number
          example: 0
          minimum: 0
          default: 0
        due_at:
          type: string
          example: '2026-09-30T23:59:59.000Z'
          format: date-time
      example:
        customer_id: cus_0t9549fps3xd
        invoice_number: INV-2026-0041
        description: September retainer
        currency: USD
        line_items:
        - name: Integration support
          description: 10 hours
          quantity: 10
          amount: 150
        due_at: '2026-09-30T23:59:59.000Z'
    UpdateInvoice:
      type: object
      properties:
        description:
          type: string
          example: September delivery
          maxLength: 2000
        line_items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        tax_amount:
          type: number
          example: 12
          minimum: 0
        discount_amount:
          type: number
          example: 0
          minimum: 0
        due_at:
          type: string
