openapi: 3.1.0
info:
  title: Mitu API
  version: 1.0.0
  description: The Mitu API lets you manage customers, Agent Wallets, payment experiences, subscriptions and agent
    payments. Authenticate server-side requests with your account API key in the `x-api-key` header over HTTPS.
servers:
- url: https://api.mitu.ai
  description: Production
- url: https://sandbox-api.mitu.ai
  description: Sandbox
security:
- ApiKey: []
tags:
- name: Health
  description: Check that your API key is valid and confirm that you can connect to the Mitu API.
- name: Customers
  description: Create and retrieve customers.
- name: Agent Wallets
  description: Issue and retrieve Agent Wallets for customers.
- name: Payment links
  description: Create and manage payment links.
- name: Invoices
  description: Create and manage invoices.
- name: Subscription plans
  description: Create and retrieve subscription plans.
- name: Subscriptions
  description: Create and manage subscriptions.
- name: Agent payments
  description: Verify requests paid through Mitu.
paths:
  /v1/ping:
    get:
      operationId: ping
      summary: Health check
      description: Check that your API key is valid and confirm that you can connect to the Mitu API.
      tags:
      - Health
      responses:
        '200':
          description: API key verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: Create a customer record and return the customer key used to connect that customer through MCP.
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
      responses:
        '201':
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listCustomers
      summary: List customers
      tags:
      - Customers
      parameters:
      - name: search
        in: query
        description: Filter customers by name, email address or phone number.
        schema:
          type: string
          maxLength: 120
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customers retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve customers associated with your account. Results are returned using cursor-based pagination.
  /v1/customers/{id}:
    get:
      operationId: getCustomer
      summary: Get a customer
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Customer retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve a customer by its Mitu customer ID.
  /v1/customers/{id}/rotate-key:
    post:
      operationId: rotateCustomerKey
      summary: Rotate a customer key
      description: Issue a new customer key and revoke the one the customer holds.
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Customer key rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedCustomerKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/customers/{id}/wallets:
    post:
      operationId: createCustomerWallet
      summary: Create a wallet
      description: Create an additional named Agent Wallet for a customer.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWallet'
      responses:
        '201':
          description: Wallet created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listCustomerWallets
      summary: Get wallets
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Wallets retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve the Agent Wallets associated with a customer. Results are returned using cursor-based
        pagination.
  /v1/wallets/{id}:
    get:
      operationId: getWallet
      summary: Get a wallet
      description: Retrieve a single Agent Wallet by its ID, including the deposit addresses held for it on each
        supported network.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Wallet retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}/transactions:
    get:
      operationId: listWalletTransactions
      summary: List wallet transactions
      description: Retrieve the credits and debits recorded against an Agent Wallet, newest first. Results are
        returned using cursor-based pagination.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      - name: type
        in: query
        description: Filter by the direction of the movement.
        schema:
          type: string
          enum:
          - credit
          - debit
      - name: reason
        in: query
        description: Filter by why the movement happened.
        schema:
          $ref: '#/components/schemas/WalletTransactionReason'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Wallet transactions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallet-transactions/{id}:
    get:
      operationId: getWalletTransaction
      summary: Get a wallet transaction
      description: Retrieve a single wallet movement by its ID. Use this to resolve the `wallet_transaction_id`
        returned by a paid request, or the `transaction_id` carried on a `wallet.credited` or `wallet.debited`
        event, without needing the wallet it belongs to.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Wallet transaction retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/payment-links:
    post:
      operationId: createPaymentLink
      summary: Create a link
      tags:
      - Payment links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLink'
      responses:
        '201':
          description: Payment link created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Create a payment link that can be completed through the supported payment experience.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listPaymentLinks
      summary: List links
      tags:
      - Payment links
      parameters:
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/PaymentLinkType'
        description: Filter by payment link type.
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/PaymentLinkStatus'
        description: Filter by payment link status.
      - name: reference
        in: query
        schema:
          type: string
        description: Filter by your payment reference.
      - name: source
        in: query
        description: Filter by the source that created the payment link.
        schema:
          type: string
          enum:
          - dashboard
          - api
          - commerce
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payment links retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve payment links created by your account. Results are returned using cursor-based pagination.
  /v1/payment-links/{id}:
    get:
      operationId: getPaymentLink
      summary: Get a link
      tags:
      - Payment links
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Payment link retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve a payment link by its ID.
    patch:
      operationId: updatePaymentLink
      summary: Update a link
      tags:
      - Payment links
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentLink'
      responses:
        '200':
          description: Payment link updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Update fields on an existing payment link that is still editable.
  /v1/payment-links/{id}/cancel:
    delete:
      operationId: cancelPaymentLink
      summary: Cancel a link
      description: Cancel a payment link that is currently cancellable.
      tags:
      - Payment links
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Payment link cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
