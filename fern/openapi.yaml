openapi: 3.1.0
info:
  title: Mitu API
  version: 1.0.0
  description: The Mitu API lets you manage customers, Agent Wallets, payment experiences, subscriptions and agent
    payments. Authenticate server-side requests with your account API key in the `x-api-key` header over HTTPS.
servers:
- url: https://api.mitu.ai
  description: Production
- url: https://sandbox-api.mitu.ai
  description: Sandbox
security:
- ApiKey: []
tags:
- name: Health
  description: Check that your API key is valid and confirm that you can connect to the Mitu API.
- name: Customers
  description: Create and retrieve customers.
- name: Agent Wallets
  description: Issue and retrieve Agent Wallets for customers.
- name: Payment links
  description: Create and manage payment links.
- name: Invoices
  description: Create and manage invoices.
- name: Subscription plans
  description: Create and retrieve subscription plans.
- name: Subscriptions
  description: Create and manage subscriptions.
- name: Agent payments
  description: Verify requests paid through Mitu.
paths:
  /v1/ping:
    get:
      operationId: ping
      summary: Health check
      description: Check that your API key is valid and confirm that you can connect to the Mitu API.
      tags:
      - Health
      responses:
        '200':
          description: API key verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: Create a customer record and return the customer key used to connect that customer through MCP.
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
      responses:
        '201':
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listCustomers
      summary: List customers
      tags:
      - Customers
      parameters:
      - name: search
        in: query
        description: Filter customers by name, email address or phone number.
        schema:
          type: string
          maxLength: 120
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customers retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve customers associated with your account. Results are returned using cursor-based pagination.
  /v1/customers/{id}:
    get:
      operationId: getCustomer
      summary: Get a customer
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Customer retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve a customer by its Mitu customer ID.
  /v1/customers/{id}/wallets:
    post:
      operationId: createCustomerWallet
      summary: Create a wallet
      description: Create an additional named Agent Wallet for a customer.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWallet'
      responses:
        '201':
          description: Wallet created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listCustomerWallets
      summary: Get wallets
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Wallets retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve the Agent Wallets associated with a customer. Results are returned using cursor-based
        pagination.
  /v1/wallets/{id}:
    get:
      operationId: getWallet
      summary: Get a wallet
      description: Retrieve a single Agent Wallet by its ID, including the deposit addresses held for it on each
        supported network.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Wallet retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallets/{id}/transactions:
    get:
      operationId: listWalletTransactions
      summary: List wallet transactions
      description: Retrieve the credits and debits recorded against an Agent Wallet, newest first. Results are
        returned using cursor-based pagination.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      - name: type
        in: query
        description: Filter by the direction of the movement.
        schema:
          type: string
          enum:
          - credit
          - debit
      - name: reason
        in: query
        description: Filter by why the movement happened.
        schema:
          $ref: '#/components/schemas/WalletTransactionReason'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Wallet transactions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/wallet-transactions/{id}:
    get:
      operationId: getWalletTransaction
      summary: Get a wallet transaction
      description: Retrieve a single wallet movement by its ID. Use this to resolve the `wallet_transaction_id`
        returned by a paid request, or the `transaction_id` carried on a `wallet.credited` or `wallet.debited`
        event, without needing the wallet it belongs to.
      tags:
      - Agent Wallets
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Wallet transaction retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/payment-links:
    post:
      operationId: createPaymentLink
      summary: Create a link
      tags:
      - Payment links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLink'
      responses:
        '201':
          description: Payment link created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Create a payment link that can be completed through the supported payment experience.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listPaymentLinks
      summary: List links
      tags:
      - Payment links
      parameters:
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/PaymentLinkType'
        description: Filter by payment link type.
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/PaymentLinkStatus'
        description: Filter by payment link status.
      - name: reference
        in: query
        schema:
          type: string
        description: Filter by your payment reference.
      - name: source
        in: query
        description: Filter by the source that created the payment link.
        schema:
          type: string
          enum:
          - dashboard
          - api
          - commerce
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payment links retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve payment links created by your account. Results are returned using cursor-based pagination.
  /v1/payment-links/{id}:
    get:
      operationId: getPaymentLink
      summary: Get a link
      tags:
      - Payment links
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Payment link retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve a payment link by its ID.
    patch:
      operationId: updatePaymentLink
      summary: Update a link
      tags:
      - Payment links
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentLink'
      responses:
        '200':
          description: Payment link updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Update fields on an existing payment link that is still editable.
  /v1/payment-links/{id}/cancel:
    delete:
      operationId: cancelPaymentLink
      summary: Cancel a link
      description: Cancel a payment link that is currently cancellable.
      tags:
      - Payment links
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Payment link cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/invoices:
    post:
      operationId: createInvoice
      summary: Create an invoice
      tags:
      - Invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoice'
      responses:
        '201':
          description: Invoice created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Create an invoice for a customer.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listInvoices
      summary: List invoices
      tags:
      - Invoices
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/InvoiceStatus'
        description: Filter by invoice status.
      - name: customer_id
        in: query
        description: Return invoices for a specific customer.
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Invoices retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve invoices created by your account. Results are returned using cursor-based pagination.
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Get an invoice
      tags:
      - Invoices
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Invoice retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve an invoice by its ID.
    patch:
      operationId: updateInvoice
      summary: Update an invoice
      tags:
      - Invoices
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoice'
      responses:
        '200':
          description: Invoice updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Update an invoice that is still editable.
  /v1/invoices/{id}/send:
    post:
      operationId: sendInvoice
      summary: Send an invoice
      tags:
      - Invoices
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Invoice sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Send an invoice to its recipient.
  /v1/invoices/{id}/cancel:
    delete:
      operationId: cancelInvoice
      summary: Cancel an invoice
      tags:
      - Invoices
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Invoice cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Cancel an invoice that is currently cancellable.
  /v1/subscription-plans:
    post:
      operationId: createSubscriptionPlan
      summary: Create a plan
      tags:
      - Subscription plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionPlan'
      responses:
        '201':
          description: Subscription plan created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Create a subscription plan that can be used to start subscriptions.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listSubscriptionPlans
      summary: List plans
      tags:
      - Subscription plans
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - paused
          - archived
        description: Filter by subscription plan status.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subscription plans retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve subscription plans created by your account. Results are returned using cursor-based
        pagination.
  /v1/subscription-plans/{id}:
    get:
      operationId: getSubscriptionPlan
      summary: Get a plan
      tags:
      - Subscription plans
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Subscription plan retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve a subscription plan by its ID.
  /v1/subscriptions:
    post:
      operationId: createSubscription
      summary: Create a subscription
      tags:
      - Subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscription'
      responses:
        '201':
          description: Subscription created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Create a subscription from an existing subscription plan.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      tags:
      - Subscriptions
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SubscriptionStatus'
        description: Filter by subscription status.
      - name: subscription_plan_id
        in: query
        schema:
          type: string
        description: Return subscriptions for a specific subscription plan.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subscriptions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve subscriptions associated with your account. Results are returned using cursor-based
        pagination.
  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: Get a subscription
      tags:
      - Subscriptions
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Subscription retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve a subscription by its ID.
  /v1/subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      summary: Cancel a subscription
      tags:
      - Subscriptions
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Subscription cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Cancel an active subscription.
  /v1/subscriptions/{id}/invoices:
    get:
      operationId: listSubscriptionInvoices
      summary: List invoices
      tags:
      - Subscriptions
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subscription invoices retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInvoiceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: Retrieve invoices generated for a subscription. Results are returned using cursor-based pagination.
  /v1/proxy-requests/{id}:
    get:
      operationId: getProxyRequest
      summary: Confirm a paid request
      description: Retrieve a paid request by the Mitu request ID received by your API.
      tags:
      - Agent payments
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Paid request retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Account API key used to authenticate server-side requests. Use the credentials issued for the
        same environment as the API base URL.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of the resource.
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key used to safely retry the same state-changing request.
      schema:
        type: string
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned as `next_cursor` from the previous response. Omit for the first request.
      schema:
        type: string
  schemas:
    PaymentLinkType:
      type: string
      enum:
      - charge
      - subscription
      - session
      - per_request
    PaymentLinkStatus:
      type: string
      enum:
      - pending
      - partial
      - active
      - settling
      - paid
      - settled
      - expired
      - cancelled
    PaymentMethod:
      type: string
      enum:
      - x402
      - mpp_crypto
      - mpp_spt
    InvoiceStatus:
      type: string
      enum:
      - draft
      - sent
      - viewed
      - settling
      - paid
      - overdue
      - cancelled
    BillingInterval:
      type: string
      enum:
      - day
      - week
      - month
      - year
    SubscriptionStatus:
      type: string
      enum:
      - active
      - past_due
      - paused
      - cancelled
      - expired
    CreateCustomer:
      type: object
      required:
      - client_reference_id
      properties:
        client_reference_id:
          type: string
          max_length: 64
          example: goro_user_8841
          description: Your own stable identifier for this customer.
        first_name:
          type: string
          max_length: 60
          example: Tele
        last_name:
          type: string
          max_length: 60
          example: Falola
        email:
          type: string
          format: email
          max_length: 180
          example: tele@mitu.ai
        phone:
          type: string
          max_length: 32
          example: '+2348012345678'
      example:
        client_reference_id: goro_user_8841
        first_name: Tele
        last_name: Falola
        email: tele@mitu.ai
        phone: '+2348012345678'
    IssuedCustomer:
      type: object
      properties:
        id:
          type: string
        client_reference_id:
          type: string
          description: Your own stable identifier for this customer.
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        key:
          type: string
          description: Customer key returned when the customer is created.
          example: mcpk_7f3a9c2e5b14d806a1f2
        mcp_url:
          type: string
        created_at:
          type: string
          format: date-time
      example:
        id: cus_0t9549fps3xd
        client_reference_id: goro_user_8841
        first_name: Tele
        last_name: Falola
        email: tele@mitu.ai
        phone: '+2348012345678'
        key: mcpk_live_7f3a9c2e5b14d806a1f2
        mcp_url: https://mcp.mitu.ai/goro
        created_at: '2026-09-09T18:41:50.204Z'
    WalletLimits:
      type: object
      description: What an agent may spend from this wallet, in USD. Zero is an explicit "no limit"; an omitted
        field keeps whatever the wallet inherited.
      properties:
        per_payment:
          type: number
          minimum: 0
          example: 25
        monthly:
          type: number
          minimum: 0
          example: 200
        approve_above:
          type: number
          minimum: 0
          example: 50
    CreateWallet:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          max_length: 80
          example: Travel
          description: What the customer calls this pot. The agent names it when paying, so it should read the way
            the customer would say it.
        limits:
          $ref: '#/components/schemas/WalletLimits'
      example:
        name: Travel
        limits:
          per_payment: 25
          monthly: 200
          approve_above: 50
    WalletSummary:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        name:
          type: string
        currency:
          type: string
          example: USDC
        limits:
          all_of:
          - $ref: '#/components/schemas/WalletLimits'
          - type: object
            properties:
              currency:
                type: string
                example: USD
        created_at:
          type: string
          format: date-time
    Wallet:
      all_of:
      - $ref: '#/components/schemas/WalletSummary'
      - type: object
        properties:
          addresses:
            type: array
            items:
              type: object
              properties:
                network:
                  type: string
                  example: base
                address:
                  type: string
      example:
        id: wal_65286515b43d4e3eba93
        customer_id: cus_0t9549fps3xd
        name: Travel
        currency: USDC
        limits:
          per_payment: 25
          monthly: 200
          approve_above: 50
          currency: USD
        addresses:
        - network: base
          address: '0xa90818aeC6b04b6E48c9bD7A5C0d8B3F17e2419d'
        - network: tempo
          address: '0xa90818aeC6b04b6E48c9bD7A5C0d8B3F17e2419d'
        - network: solana
          address: 7U6P9CrM7CqkYyNbBLpKfoJcWn4sVz1TgDxMhRa2EuQK
        created_at: '2026-09-11T00:32:58.292Z'
    WalletTransactionReason:
      type: string
      enum:
      - deposit
      - payment
      - withdrawal
      - reversal
    WalletTransactionDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - merchant
          - external
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    WalletTransaction:
      type: object
      description: One movement of money into or out of an Agent Wallet. `balance_after` is the balance of this
        wallet alone, not the customer's combined balance across wallets.
      properties:
        id:
          type: string
        wallet_id:
          type: string
        customer_id:
          type: string
        type:
          type: string
          enum:
          - credit
          - debit
        reason:
          $ref: '#/components/schemas/WalletTransactionReason'
        amount:
          type: string
          description: Decimal amount, sent as a string.
        currency:
          type: string
          example: USDC
        network:
          type: string
          nullable: true
          example: base
        destination:
          oneOf:
          - $ref: '#/components/schemas/WalletTransactionDestination'
          - type: 'null'
          description: Where a debit went. `null` for credits.
        tx_hash:
          type: string
          nullable: true
          description: The onchain settlement you can verify yourself.
        balance_after:
          type: string
          description: The wallet's balance once this movement was applied.
        created_at:
          type: string
          format: date-time
      example:
        id: f5533e85-16d8-4f58-ba22-86dba59c6a15
        wallet_id: wal_65286515b43d4e3eba93
        customer_id: cus_0t9549fps3xd
        type: debit
        reason: payment
        amount: '0.035000'
        currency: USDC
        network: base
        destination:
          type: merchant
          name: AgentPizza
          address: '0x1DDb114B971E67241B3aF19C958a01EBBfb1B6DD'
        tx_hash: '0xfe093b9a57695615cc453f86b2890eb70e0a2860ce040f54af7aca03ce2a89ab'
        balance_after: '0.032000'
        created_at: '2026-09-09T19:03:28.480Z'
    CreatePaymentLink:
      type: object
      properties:
        type:
          all_of:
          - $ref: '#/components/schemas/PaymentLinkType'
          default: charge
        amount:
          type: number
          description: Required for `charge` and `per_request`. `session` uses `sessionMaxDeposit`; `subscription`
            derives it from the plan.
        currency:
          type: string
          example: NGN
          description: Required except for `subscription`, which takes it from the plan.
        plan_id:
          type: string
          description: subscription only — a single plan id.
        plan_ids:
          type: array
          items:
            type: string
          description: subscription only — offer several plans for the payer to pick.
        allow_customer_choice:
          type: boolean
          default: false
          description: subscription only — let the payer choose among `planIds`.
        description:
          type: string
          max_length: 2000
        reference:
          type: string
          max_length: 255
          description: Your own reference for this payment.
        expires_at:
          type: string
          format: date-time
        endpoint_pattern:
          type: string
          max_length: 500
          description: per_request only.
        session_max_deposit:
          type: number
          description: session only.
        session_expires_at:
          type: string
          format: date-time
          description: session only.
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        metadata:
          type: object
          additional_properties:
            type: string
          description: Free-form metadata returned with the payment.
      example:
        type: charge
        amount: 25
        currency: USD
        description: Two large pizzas
        reference: ORDER-8841
        payment_methods:
        - x402
        - mpp_crypto
        metadata:
          order_id: '8841'
    UpdatePaymentLink:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        description:
          type: string
          max_length: 2000
        reference:
          type: string
          max_length: 255
        metadata:
          type: object
          additional_properties:
            type: string
      example:
        description: Two large pizzas and a side
        reference: ORDER-8841
        expires_at: '2026-09-30T23:59:59.000Z'
    InvoiceLineItem:
      type: object
      required:
      - name
      - quantity
      - amount
      properties:
        name:
          type: string
          max_length: 255
        description:
          type: string
          max_length: 500
        quantity:
          type: integer
          minimum: 1
        amount:
          type: number
      example:
        name: Integration support
        description: 10 hours
        quantity: 10
        amount: 150
    CreateInvoice:
      type: object
      required:
      - customer_id
      - line_items
      - currency
      properties:
        customer_id:
          type: string
          description: Who the invoice is addressed to.
        invoice_number:
          type: string
          max_length: 50
        description:
          type: string
          max_length: 2000
        line_items:
          type: array
          min_items: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        currency:
          type: string
          example: USD
        tax_amount:
          type: number
          minimum: 0
          default: 0
        discount_amount:
          type: number
          minimum: 0
          default: 0
        due_at:
          type: string
          format: date-time
      example:
        customer_id: cus_0t9549fps3xd
        invoice_number: INV-2026-0041
        description: September retainer
        currency: USD
        line_items:
        - name: Integration support
          description: 10 hours
          quantity: 10
          amount: 150
        due_at: '2026-09-30T23:59:59.000Z'
    UpdateInvoice:
      type: object
      properties:
        description:
          type: string
          max_length: 2000
        line_items:
          type: array
          min_items: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        tax_amount:
          type: number
          minimum: 0
        discount_amount:
          type: number
          minimum: 0
        due_at:
          type: string
          format: date-time
      example:
        description: September retainer (revised)
        line_items:
        - name: Integration support
          quantity: 12
          amount: 150
        due_at: '2026-10-07T23:59:59.000Z'
    CreateSubscriptionPlan:
      type: object
      required:
      - name
      - amount
      - currency
      - billing_interval
      properties:
        name:
          type: string
          max_length: 255
        description:
          type: string
          max_length: 2000
        amount:
          type: number
        currency:
          type: string
          example: USD
        billing_interval:
          $ref: '#/components/schemas/BillingInterval'
        features:
          type: array
          items:
            type: string
      example:
        name: Pro
        description: For teams shipping agents in production
        amount: 49
        currency: USD
        billing_interval: month
        features:
        - Unlimited agents
        - Priority support
    CreateSubscription:
      type: object
      required:
      - subscription_plan_id
      - payment_method
      properties:
        subscription_plan_id:
          type: string
        payment_method:
          type: string
          enum:
          - mpp_crypto
          - mpp_spt
          description: Recurring charges settle over MPP.
        subscriber_id:
          type: string
          description: Agent or user id that subscribed.
        subscriber_type:
          type: string
          enum:
          - agent
          - user
          default: agent
      example:
        subscription_plan_id: plan_3j8w2q7xr1md
        payment_method: mpp_crypto
        subscriber_id: agt_5m1p8w3ldx7b
        subscriber_type: agent
    Ping:
      type: object
      properties:
        ok:
          type: boolean
        account_id:
          type: string
        environment:
          type: string
          example: production
      example:
        ok: true
        account_id: 8f14e45f-ceea-467a-9f0b-3c2d1a7b4e90
        environment: production
    Customer:
      type: object
      properties:
