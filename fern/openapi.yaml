openapi: 3.1.0
info:
  title: Mitu API
  version: "1.0.0"
  description: |
    The Mitu public API. Authenticate with your secret key in the `x-api-key`
    header over HTTPS.
servers:
  - url: https://api.mitu.ai
    description: Production
security:
  - ApiKey: []
paths:
  /economy/v1/public/ping:
    get:
      operationId: ping
      summary: Check a key
      description: Confirms a key is valid, with no side effects.
      tags: [Health]
      responses:
        "200":
          description: The key is valid.
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
