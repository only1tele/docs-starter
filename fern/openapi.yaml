        wallet_transaction_id:
          type: string
          nullable: true
          description: The settlement you can check on-chain yourself.
        created_at: { type: string, format: date-time }
      example:
        request_id: req_abc123
        service_id: svc_dhydwg80dzb4vy6xjl2m
        paid: true
        amount: "0.035000"
        currency: USDC
        method: POST
        path: /orders
