# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: mitu.docs.buildwithfern.com
    custom-domain: docs.mitu.ai

title: Mitu API Documentation

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
  content-width: 800px
  sidebar-width: 272px

tabs:
  home:
    display-name: Home
    icon: house
  guides:
    display-name: Guides
    icon: book-open
  platform:
    display-name: Platform
    icon: layer-group
  api-reference:
    display-name: API reference
    icon: code

navigation:
  - tab: home
    layout:
      - page: Welcome
        path: docs/pages/home.mdx
        slug: welcome

  - tab: guides
    layout:
      - page: Platform overview
        path: docs/pages/overview.mdx
      - section: Quick start
        contents:
          - page: Get set up with Mitu
            path: docs/pages/setup.mdx
          - page: Create your first customer
            path: docs/pages/first-customer.mdx
          - page: Issue your first wallet
            path: docs/pages/first-wallet.mdx
          - page: Accept your first payment
            path: docs/pages/first-payment.mdx
          - page: Configure webhooks
            path: docs/pages/setup-webhooks.mdx
      - section: Use cases
        contents:
          - page: Agent channels
            path: docs/pages/uc-app.mdx
          - page: API monetisation
            path: docs/pages/uc-sell-api.mdx
          - page: Agent commerce
            path: docs/pages/uc-buy.mdx
          - page: Agent wallets
            path: docs/pages/uc-spend.mdx
          - page: Universal payments
            path: docs/pages/uc-links.mdx
          - page: Agent purchasing
            path: docs/pages/uc-build.mdx
      - section: Integration guides
        contents:
          - page: Connect to AI agents
            path: docs/pages/guide-connect.mdx
          - page: Accept payment from agents
            path: docs/pages/guide-byo.mdx
          - page: Issue wallets to customers
            path: docs/pages/guide-wallets.mdx
          - page: Connect customer accounts
            path: docs/pages/guide-accounts.mdx
          - page: Create payment experiences
            path: docs/pages/guide-payments.mdx
  - tab: platform
    layout:
      - section: Payments
        contents:
          - page: Overview
            path: docs/pages/payments.mdx
          - page: Agent payments
            path: docs/pages/agent-payments.mdx
          - page: Pricing
            path: docs/pages/pricing.mdx
          - page: Payment experiences
            path: docs/pages/payment-links.mdx
          - page: Invoices
            path: docs/pages/invoices.mdx
          - page: Subscriptions
            path: docs/pages/subscriptions.mdx
          - page: Settlement
            path: docs/pages/settlement.mdx
      - section: Agent Wallets
        contents:
          - page: Overview
            path: docs/pages/wallets.mdx
          - page: Limits and controls
            path: docs/pages/limits.mdx
          - page: Funding
            path: docs/pages/funding.mdx
          - page: Wallet tools
            path: docs/pages/wallet-tools.mdx
          - page: Multiple wallets
            path: docs/pages/multiple-wallets.mdx
      - section: Customers
        contents:
          - page: Overview
            path: docs/pages/customers-overview.mdx
          - page: Customer API
            path: docs/pages/customers.mdx
          - page: Customer keys
            path: docs/pages/customer-keys.mdx
          - page: OAuth
            path: docs/pages/oauth-customers.mdx
            slug: oauth
      - section: MCP
        contents:
          - page: Overview
            path: docs/pages/mcp.mdx
          - page: Endpoints
            path: docs/pages/endpoints.mdx
          - page: Tool schemas
            path: docs/pages/tool-schemas.mdx
          - page: Authentication
            path: docs/pages/mcp-auth.mdx
          # Auto-derives to open-api-import: Fern splits the slug at the case
          # boundary in OpenAPI, as it does for OAuth.
          - page: OpenAPI import
            path: docs/pages/openapi-import.mdx
          - page: Domains
            path: docs/pages/domain.mdx
          - page: Buying through the Mitu MCP
            path: docs/pages/mitu-mcp.mdx
            slug: mitu-mcp
      - section: Webhooks
        contents:
          - page: Overview
            path: docs/pages/webhooks.mdx
          - page: Events
            path: docs/pages/events.mdx
      - section: Security
        contents:
          - page: Request verification
            path: docs/pages/verify.mdx
          - page: Keys and secrets
            path: docs/pages/dashboard.mdx
  - tab: api-reference
    layout:
      - page: Authentication
        path: docs/pages/auth.mdx
      - page: Idempotency
        path: docs/pages/idempotency.mdx
      - page: Common integration errors
        path: docs/pages/mistakes.mdx
      - api: API Reference
        skip-slug: true

redirects:
  # Plans moved under Subscriptions: a plan only exists to be subscribed to,
  # so splitting them across two tags made one flow span two sidebar groups.
  - source: "/api-reference/subscription-plans/create-subscription-plan"
    destination: "/api-reference/subscriptions/create-subscription-plan"
  - source: "/api-reference/subscription-plans/list-subscription-plans"
    destination: "/api-reference/subscriptions/list-subscription-plans"
  - source: "/api-reference/subscription-plans/get-subscription-plan"
    destination: "/api-reference/subscriptions/get-subscription-plan"
  - source: "/api-reference/endpoints"
    destination: "/api-reference/authentication"
  - source: "/platform/customers/customers-through-o-auth"
    destination: "/platform/customers/oauth"
  - source: "/guides/integration-guides/authenticate-with-your-identity-provider"
    destination: "/guides/integration-guides/connect-customer-accounts"
  - source: "/guides/integration-guides/payment-links"
    destination: "/guides/integration-guides/create-payment-experiences"
  - source: "/support"
    destination: "/guides/platform-overview"
  - source: "/guides/what-we-support"
    destination: "/guides/platform-overview"

  - source: "/platform/payments/402-payment-flow"
    destination: "/platform/payments/agent-payments"
  - source: "/platform/payments/payment-methods"
    destination: "/platform/payments/agent-payments"
  - source: "/platform/payments/paid-but-not-delivered"
    destination: "/platform/payments/agent-payments"
  - source: "/platform/payments/dynamic-pricing"
    destination: "/platform/payments/pricing"
  - source: "/platform/the-mcp/endpoint-types"
    destination: "/platform/payments/pricing"
  - source: "/platform/payments/payment-links"
    destination: "/platform/payments/payment-experiences"
  - source: "/platform/payments/payouts"
    destination: "/platform/payments/settlement"
  - source: "/platform/wallets/overview"
    destination: "/platform/agent-wallets/overview"
  - source: "/platform/wallets/limits-and-controls"
    destination: "/platform/agent-wallets/limits-and-controls"
  - source: "/platform/wallets/funding"
    destination: "/platform/agent-wallets/funding"
  - source: "/platform/wallets/wallet-tools"
    destination: "/platform/agent-wallets/wallet-tools"
  - source: "/platform/wallets/multiple-wallets"
    destination: "/platform/agent-wallets/multiple-wallets"

  - source: "/platform/customers/customers-api"
    destination: "/platform/customers/customer-api"
  - source: "/platform/the-mcp/overview"
    destination: "/platform/mcp/overview"
  - source: "/platform/the-mcp/endpoints"
    destination: "/platform/mcp/endpoints"
  - source: "/platform/the-mcp/authentication"
    destination: "/platform/mcp/authentication"
  - source: "/platform/the-mcp/domain-and-integration"
    destination: "/platform/mcp/domains"
  - source: "/platform/the-mcp/mitu-mcp"
    destination: "/platform/mcp/mitu-mcp"
  - source: "/platform/additional-information/webhooks"
    destination: "/platform/webhooks/overview"
  - source: "/platform/additional-information/events"
    destination: "/platform/webhooks/events"
  - source: "/platform/additional-information/request-signature-verification"
    destination: "/platform/security/request-verification"
  - source: "/platform/additional-information/keys-secrets-and-logs"
    destination: "/platform/security/keys-and-secrets"

navbar-links:
  - type: minimal
    text: Support
    url: mailto:support@mitu.ai
  - type: filled
    text: Dashboard
    url: https://app.mitu.ai

colors:
  # Light only. Giving Fern a dark value for each is what turns dark mode on,
  # and the artboards have one theme: white ground, ink type.
  #
  # Green is a BUTTON FILL with white on it in the design, never a link colour -
  # prose links are the deep ink, underlined. Fern's accent drives links, so
  # green here would be 2.28:1 on white.
  accent-primary: "#062638"
  background: "#FFFFFF"
  border: "#e2e2de"
  sidebar-background: "#FFFFFF"
  header-background: "#FFFFFF"
  card-background: "#FFFFFF"

typography:
  bodyFont:
    name: Manrope
    fallback: ["Helvetica", "Arial", "sans-serif"]
  headingsFont:
    name: Manrope
    fallback: ["Helvetica", "Arial", "sans-serif"]
  codeFont:
    name: JetBrains Mono
    fallback: ["ui-monospace", "Menlo", "monospace"]

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  light: docs/assets/mitu-logo.svg
  # The artboard draws it at 51px tall inside a 63px box; with the box trimmed
  # to the artwork, 30 is the same optical size.
  height: 30
  href: /

favicon: docs/assets/favicon.svg

css: styles.css

metadata:
  og:dynamic: true
